# LoganLM 演示训练：手动触发，在云端从零训练一个新模型
name: Train Demo

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 训练步数
        default: "900"
      dim:
        description: 隐藏维度
        default: "192"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 CPU 版 PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 从零训练（分词器 + 语言模型）
        run: |
          python scripts/train_demo.py --steps ${{ github.event.inputs.steps || '900' }} \
                                       --dim ${{ github.event.inputs.dim || '192' }}

      - name: 训练后立即冒烟测试
        run: python tests/test_smoke.py

      - name: 上传模型产物
        uses: actions/upload-artifact@v4
        with:
          name: loganlm-checkpoint
          path: checkpoints/demo/
